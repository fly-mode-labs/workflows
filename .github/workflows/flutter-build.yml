name: Build - Flutter orchestrator

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      flutter-version:
        type: string
        default: stable
      runner-labels:
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      platforms-json:
        description: JSON matrix containing checks and selected platforms
        required: true
        type: string
      android-build-format:
        description: Android artifact format; apk, appbundle or both
        type: string
        default: both

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  task:
    name: ${{ matrix.task.id == 'checks' && matrix.task.name || format('Build {0}', matrix.task.name) }}
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJSON(inputs.platforms-json) }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 40
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Setup Flutter SDK and dependencies
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Read and validate application version
        uses: Juanpabedoyav/workflows/.github/actions/flutter/read-version@v1
        id: version
        if: matrix.task.id != 'checks'
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Run Flutter static analysis and tests
        if: matrix.task.id == 'checks'
        run: |
          flutter analyze
          flutter test
      - name: Build Android artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-android@v1
        if: matrix.task.id == 'android'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
          build-format: ${{ inputs.android-build-format }}
      - name: Build iOS artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-ios@v1
        if: matrix.task.id == 'ios'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
      - name: Build Web artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-web@v1
        if: matrix.task.id == 'web'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
