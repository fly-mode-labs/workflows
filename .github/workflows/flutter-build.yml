name: Build / Flutter orchestrator

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      flutter-version:
        type: string
        default: stable
      runner-labels:
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      platforms-json:
        description: JSON array containing only selected platforms
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build / Flutter / Quality
    uses: Juanpabedoyav/workflows/.github/workflows/build-job-flutter-quality.yml@v1
    with:
      working-directory: ${{ inputs.working-directory }}
      flutter-version: ${{ inputs.flutter-version }}
      runner-labels: ${{ inputs.runner-labels }}

  platform:
    name: Build / Flutter / ${{ matrix.platform }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms-json) }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/build-android@v1
        if: matrix.platform == 'android'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ needs.quality.outputs.full-version }}
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/build-ios@v1
        if: matrix.platform == 'ios'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ needs.quality.outputs.full-version }}
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/build-web@v1
        if: matrix.platform == 'web'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ needs.quality.outputs.full-version }}
