name: Build - Flutter orchestrator

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      flutter-version:
        type: string
        default: stable
      xcode-version:
        description: Xcode version reported by xcodebuild, or default
        type: string
        default: default
      runner:
        description: Runner provider; self-hosted or github-hosted
        type: string
        default: self-hosted
      runner-labels:
        description: JSON array of labels used by the self-hosted runner
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      build-android:
        description: Run the Android build job
        type: boolean
        default: false
      build-ios:
        description: Run the iOS build job
        type: boolean
        default: false
      build-web:
        description: Run the Web build job
        type: boolean
        default: false
      android-build-format:
        description: Android artifact format; apk, appbundle or both
        type: string
        default: both

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Flutter build / Checks
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || inputs.runner-labels) }}
    timeout-minutes: 40
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Setup Flutter SDK and dependencies
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Run Flutter static analysis and tests
        shell: bash
        working-directory: ${{ inputs.working-directory }}
        run: |
          analysis_targets=(lib)
          for source_directory in test integration_test; do
            if [[ -d "${source_directory}" ]]; then
              analysis_targets+=("${source_directory}")
            fi
          done
          flutter analyze "${analysis_targets[@]}"
          flutter test

  android:
    name: Flutter build / Android
    if: inputs.build-android
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || inputs.runner-labels) }}
    timeout-minutes: 40
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Setup Flutter SDK and dependencies
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Read and validate application version
        uses: Juanpabedoyav/workflows/.github/actions/flutter/read-version@v2
        id: version
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Build Android artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-android@v2
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
          build-format: ${{ inputs.android-build-format }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.KEYALIAS }}
          store-password: ${{ secrets.STOREPASSWORD }}
          key-password: ${{ secrets.KEYPASSWORD }}

  ios:
    name: Flutter build / iOS
    if: inputs.build-ios
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '["macos-latest"]' || inputs.runner-labels) }}
    timeout-minutes: 40
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Select Xcode version
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup-xcode@v2
        with:
          xcode-version: ${{ inputs.xcode-version }}
      - name: Setup Flutter SDK and dependencies
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Read and validate application version
        uses: Juanpabedoyav/workflows/.github/actions/flutter/read-version@v2
        id: version
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Build iOS artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-ios@v2
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
          match-password: ${{ secrets.MATCH_PASSWORD }}
          match-git-basic-authorization: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          app-store-connect-api-key-base64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          app-store-connect-issuer-id: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          app-store-connect-key-id: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

  web:
    name: Flutter build / Web
    if: inputs.build-web
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || inputs.runner-labels) }}
    timeout-minutes: 40
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Setup Flutter SDK and dependencies
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Read and validate application version
        uses: Juanpabedoyav/workflows/.github/actions/flutter/read-version@v2
        id: version
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Build Web artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-web@v2
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
