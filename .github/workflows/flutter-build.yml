name: Build / Flutter orchestrator

on:
  workflow_call:
    inputs:
      working-directory:
        required: true
        type: string
      flutter-version:
        type: string
        default: stable
      runner-labels:
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      platforms-json:
        description: JSON array containing only selected platforms
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static analysis and tests
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 40
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Setup Flutter SDK and dependencies
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Run Flutter static analysis and tests
        run: |
          flutter analyze
          flutter test

  platform:
    name: Build ${{ matrix.platform.name }}
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platforms-json) }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 40
    steps:
      - name: Checkout application
        uses: actions/checkout@v4
      - name: Setup Flutter SDK and dependencies
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Read and validate application version
        uses: Juanpabedoyav/workflows/.github/actions/flutter/read-version@v1
        id: version
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Build Android artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-android@v1
        if: matrix.platform.id == 'android'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
      - name: Build iOS artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-ios@v1
        if: matrix.platform.id == 'ios'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
      - name: Build Web artifacts
        uses: Juanpabedoyav/workflows/.github/actions/flutter/build-web@v1
        if: matrix.platform.id == 'web'
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
