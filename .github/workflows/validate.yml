name: Validate pipeline

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-version-parser:
    name: Validate Flutter version parser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@v2
      - name: Run parser regression tests
        shell: bash
        run: bash .github/actions/flutter/setup/test-read-version.sh
      - name: Validate first-party workflow version alignment
        shell: bash
        run: bash .github/test-version-alignment.sh
      - name: Run App Store metadata staging tests
        shell: bash
        run: bash .github/actions/flutter/release-ios/test-stage-metadata.sh
