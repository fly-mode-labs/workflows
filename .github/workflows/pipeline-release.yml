name: Release pipeline version

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  validate-and-release:
    name: Validate and publish ${{ github.ref_name }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate tag against VERSION
        shell: bash
        run: |
          expected="v$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF_NAME}" != "${expected}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${expected})"
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
      - name: Update compatible major alias
        shell: bash
        run: |
          major_tag="${GITHUB_REF_NAME%%.*}"
          git tag --force "${major_tag}" "${GITHUB_SHA}"
          git push origin "refs/tags/${major_tag}" --force
