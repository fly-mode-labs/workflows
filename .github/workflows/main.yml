name: Central pipeline

on:
  workflow_call:
    inputs:
      technology:
        description: Application technology handled by the pipeline
        required: true
        type: string
      platforms:
        description: Comma-separated platforms or auto
        type: string
        default: auto
      android-build-format:
        description: Android draft artifact format; apk, appbundle or both
        type: string
        default: both
      working-directory:
        description: Application path or auto to locate pubspec.yaml
        type: string
        default: auto
      runner:
        description: Runner provider; self-hosted or github-hosted
        type: string
        default: self-hosted
      runner-labels:
        description: JSON array of labels used by the self-hosted runner
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      stage:
        description: auto, draft, beta or production
        type: string
        default: auto

permissions:
  actions: read
  contents: read

jobs:
  validate:
    name: Validate pipeline configuration
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || inputs.runner-labels) }}
    timeout-minutes: 5
    outputs:
      stage: ${{ steps.config.outputs.stage }}
      working-directory: ${{ steps.config.outputs.working-directory }}
      android: ${{ steps.config.outputs.android }}
      ios: ${{ steps.config.outputs.ios }}
      web: ${{ steps.config.outputs.web }}
      platforms-json: ${{ steps.config.outputs.platforms-json }}
      flutter-version: ${{ steps.config.outputs.flutter-version }}
      xcode-version: ${{ steps.config.outputs.xcode-version }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate technology and stage
        id: config
        shell: bash
        env:
          TECHNOLOGY: ${{ inputs.technology }}
          CONFIGURED_STAGE: ${{ inputs.stage }}
          EVENT_STAGE: ${{ github.event.inputs.stage }}
          CONFIGURED_DIRECTORY: ${{ inputs.working-directory }}
          CONFIGURED_PLATFORMS: ${{ inputs.platforms }}
          ANDROID_BUILD_FORMAT: ${{ inputs.android-build-format }}
          CONFIGURED_RUNNER: ${{ inputs.runner }}
          REPOSITORY_FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION }}
          REPOSITORY_XCODE_VERSION: ${{ vars.XCODE_VERSION }}
        run: |
          if [[ "${TECHNOLOGY}" != "flutter" ]]; then
            echo "Unsupported technology: ${TECHNOLOGY}"
            exit 1
          fi

          case "${CONFIGURED_RUNNER}" in
            self-hosted|github-hosted) ;;
            *) echo "Unsupported runner: ${CONFIGURED_RUNNER}"; exit 1 ;;
          esac

          effective_stage="${CONFIGURED_STAGE}"
          if [[ "${effective_stage}" == "auto" && -n "${EVENT_STAGE}" ]]; then
            effective_stage="${EVENT_STAGE}"
          fi
          case "${effective_stage}" in
            auto|draft|beta|production) ;;
            *) echo "Unsupported stage: ${effective_stage}"; exit 1 ;;
          esac
          echo "stage=${effective_stage}" >> "${GITHUB_OUTPUT}"

          effective_flutter_version="${REPOSITORY_FLUTTER_VERSION:-stable}"
          effective_xcode_version="${REPOSITORY_XCODE_VERSION:-default}"
          echo "flutter-version=${effective_flutter_version}" >> "${GITHUB_OUTPUT}"
          echo "xcode-version=${effective_xcode_version}" >> "${GITHUB_OUTPUT}"

          app_directory="${CONFIGURED_DIRECTORY}"
          if [[ "${app_directory}" == "auto" ]]; then
            pubspecs="$(find . -maxdepth 2 -type f -name pubspec.yaml | sort)"
            pubspec_count="$(printf '%s\n' "${pubspecs}" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [[ "${pubspec_count}" -ne 1 ]]; then
              echo "Expected one pubspec.yaml, found ${pubspec_count}. Set working-directory explicitly."
              exit 1
            fi
            app_directory="$(dirname "${pubspecs}")"
            app_directory="${app_directory#./}"
          fi
          if [[ ! -f "${app_directory}/pubspec.yaml" ]]; then
            echo "pubspec.yaml not found in ${app_directory}"
            exit 1
          fi
          echo "working-directory=${app_directory}" >> "${GITHUB_OUTPUT}"
          case "${ANDROID_BUILD_FORMAT}" in
            apk|appbundle|both) ;;
            *) echo "Unsupported Android build format: ${ANDROID_BUILD_FORMAT}"; exit 1 ;;
          esac
          normalized_platforms="${CONFIGURED_PLATFORMS// /}"
          if [[ "${normalized_platforms}" != "auto" ]]; then
            IFS=',' read -r -a requested_platforms <<< "${normalized_platforms}"
            for requested_platform in "${requested_platforms[@]}"; do
              case "${requested_platform}" in
                android|ios|web) ;;
                *) echo "Unsupported platform: ${requested_platform}"; exit 1 ;;
              esac
            done
          fi

          platforms_json='[{"id":"checks","name":"Static analysis and tests"}'
          platform_separator=','
          platform_count=0
          for platform in android ios web; do
            enabled=false
            if [[ "${normalized_platforms}" == "auto" && -d "${app_directory}/${platform}" ]]; then
              enabled=true
            elif [[ ",${normalized_platforms}," == *",${platform},"* ]]; then
              enabled=true
            fi
            if [[ "${enabled}" == "true" && ! -d "${app_directory}/${platform}" ]]; then
              echo "Platform ${platform} was requested but ${app_directory}/${platform} does not exist."
              exit 1
            fi
            echo "${platform}=${enabled}" >> "${GITHUB_OUTPUT}"
            if [[ "${enabled}" == "true" ]]; then
              platform_count=$((platform_count + 1))
              case "${platform}" in
                android) platform_name='Android' ;;
                ios) platform_name='iOS' ;;
                web) platform_name='Web' ;;
              esac
              platforms_json="${platforms_json}${platform_separator}{\"id\":\"${platform}\",\"name\":\"${platform_name}\"}"
              platform_separator=','
            fi
          done
          platforms_json="${platforms_json}]"
          if [[ "${platform_count}" -eq 0 ]]; then
            echo "No build platforms were selected."
            exit 1
          fi
          echo "platforms-json=${platforms_json}" >> "${GITHUB_OUTPUT}"

  flutter-build:
    name: Flutter / Build
    needs: validate
    if: >-
      (needs.validate.outputs.stage == 'draft') ||
      (needs.validate.outputs.stage == 'auto' && github.event_name == 'pull_request' &&
      github.event.pull_request.draft == true && github.event.action != 'closed')
    uses: Juanpabedoyav/workflows/.github/workflows/flutter-build.yml@v2
    with:
      working-directory: ${{ needs.validate.outputs.working-directory }}
      flutter-version: ${{ needs.validate.outputs.flutter-version }}
      xcode-version: ${{ needs.validate.outputs.xcode-version }}
      runner: ${{ inputs.runner }}
      runner-labels: ${{ inputs.runner-labels }}
      platforms-json: ${{ needs.validate.outputs.platforms-json }}
      android-build-format: ${{ inputs.android-build-format }}
    secrets: inherit

  flutter-beta-release:
    name: Flutter / Beta release
    needs: validate
    if: >-
      (needs.validate.outputs.stage == 'beta') ||
      (needs.validate.outputs.stage == 'auto' && github.event_name == 'pull_request' &&
      github.event.action == 'ready_for_review')
    uses: Juanpabedoyav/workflows/.github/workflows/flutter-release.yml@v2
    with:
      stage: beta
      working-directory: ${{ needs.validate.outputs.working-directory }}
      flutter-version: ${{ needs.validate.outputs.flutter-version }}
      xcode-version: ${{ needs.validate.outputs.xcode-version }}
      runner: ${{ inputs.runner }}
      runner-labels: ${{ inputs.runner-labels }}
      release-android: ${{ needs.validate.outputs.android == 'true' }}
      release-ios: ${{ needs.validate.outputs.ios == 'true' }}
    secrets: inherit

  flutter-production-release:
    name: Flutter / Production release
    needs: validate
    if: >-
      (needs.validate.outputs.stage == 'production') ||
      (needs.validate.outputs.stage == 'auto' && github.event_name == 'pull_request' &&
      github.event.action == 'closed' && github.event.pull_request.merged == true)
    uses: Juanpabedoyav/workflows/.github/workflows/flutter-release.yml@v2
    with:
      stage: production
      working-directory: ${{ needs.validate.outputs.working-directory }}
      flutter-version: ${{ needs.validate.outputs.flutter-version }}
      xcode-version: ${{ needs.validate.outputs.xcode-version }}
      runner: ${{ inputs.runner }}
      runner-labels: ${{ inputs.runner-labels }}
      release-android: ${{ needs.validate.outputs.android == 'true' }}
      release-ios: ${{ needs.validate.outputs.ios == 'true' }}
    secrets: inherit
