name: Build job / Flutter Android

on:
  workflow_call:
    inputs:
      working-directory: {required: true, type: string}
      flutter-version: {type: string, default: stable}
      runner-labels: {type: string, default: '["self-hosted", "macOS", "ARM64"]'}
      full-version: {required: true, type: string}

permissions:
  contents: read

jobs:
  android:
    name: APK and Android App Bundle
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 35
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v1
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - run: |
          flutter build apk --release
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-${{ inputs.full-version }}-${{ github.sha }}
          path: |
            ${{ inputs.working-directory }}/build/app/outputs/flutter-apk/*.apk
            ${{ inputs.working-directory }}/build/app/outputs/bundle/**/*.aab
          retention-days: 14
          if-no-files-found: error
