name: Release / Flutter orchestrator

on:
  workflow_call:
    inputs:
      stage:
        required: true
        type: string
      delivery-mode:
        description: Mobile binary delivery; artifact or direct
        type: string
        default: artifact
      source-sha:
        required: true
        type: string
      artifact-run-id:
        description: Workflow run containing build artifacts; falls back to a previous successful build when omitted
        type: string
        default: ''
      working-directory:
        required: true
        type: string
      flutter-version:
        type: string
        default: stable
      java-version:
        type: string
        default: '17'
      xcode-version:
        type: string
        default: default
      runner:
        description: Runner provider; self-hosted or github-hosted
        type: string
        default: self-hosted
      runner-labels:
        description: JSON array of labels used by the self-hosted runner
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      release-android:
        type: boolean
        default: false
      app-identifier:
        description: Android application identifier used for Google Play releases
        type: string
        default: ''
      android-track:
        description: Google Play closed-testing track receiving beta releases
        type: string
        default: alpha
      release-ios:
        type: boolean
        default: false
    secrets:
      PACKAGES_TOKEN:
        description: GitHub token with read access to private Flutter package repositories
        required: false
      ANDROID_KEYSTORE_BASE64:
        description: Base64-encoded Android signing keystore
        required: false
      KEYALIAS:
        description: Android signing key alias
        required: false
      STOREPASSWORD:
        description: Android signing store password
        required: false
      KEYPASSWORD:
        description: Android signing key password
        required: false
      MATCH_PASSWORD:
        description: Fastlane Match repository encryption password
        required: false
      MATCH_GIT_BASIC_AUTHORIZATION:
        description: Fastlane Match Git basic authorization
        required: false
      APP_STORE_CONNECT_API_KEY_BASE64:
        description: Base64-encoded App Store Connect API private key
        required: false
      APP_STORE_CONNECT_ISSUER_ID:
        description: App Store Connect API issuer ID
        required: false
      APP_STORE_CONNECT_KEY_ID:
        description: App Store Connect API key ID
        required: false
      ANDROID_PUBLISHER_CREDENTIALS:
        description: Google Play service-account JSON
        required: false
      FIREBASE_SERVICE_ACCOUNT_JSON:
        description: Firebase App Distribution service-account JSON
        required: false

permissions:
  actions: read
  contents: read

concurrency:
  group: flutter-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  resolve-build-artifacts:
    name: Resolve previous build artifacts
    if: >-
      inputs.delivery-mode == 'artifact' &&
      inputs.artifact-run-id == '' &&
      ((inputs.stage == 'beta' && (inputs.release-android || inputs.release-ios)) ||
      (inputs.stage == 'production' && inputs.release-android))
    runs-on: ${{ fromJSON(inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || inputs.runner-labels) }}
    timeout-minutes: 45
    outputs:
      run-id: ${{ steps.artifacts.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Read application version
        uses: fly-mode-labs/workflows/.github/actions/flutter/read-version@v3
        id: version
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Locate artifacts from a successful previous build
        id: artifacts
        uses: actions/github-script@v8
        env:
          FULL_VERSION: ${{ steps.version.outputs.full-version }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REQUIRE_ANDROID: ${{ inputs.release-android }}
          REQUIRE_IOS: ${{ inputs.stage == 'beta' && inputs.release-ios }}
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const currentRunId = Number(context.runId);
            const requiredNames = [];

            if (process.env.REQUIRE_ANDROID === 'true') {
              requiredNames.push(`android-${process.env.FULL_VERSION}-${process.env.SOURCE_SHA}`);
            }
            if (process.env.REQUIRE_IOS === 'true') {
              requiredNames.push(`ios-${process.env.FULL_VERSION}-${process.env.SOURCE_SHA}`);
            }

            const waitIntervalMilliseconds = 30_000;
            const waitDeadline = Date.now() + 40 * 60 * 1000;

            while (true) {
              const artifactsByRun = new Map();
              for (const name of requiredNames) {
                const artifacts = await github.paginate(
                  github.rest.actions.listArtifactsForRepo,
                  { owner, repo, name, per_page: 100 }
                );

                for (const artifact of artifacts) {
                  if (artifact.expired || !artifact.workflow_run) continue;
                  const runArtifacts = artifactsByRun.get(artifact.workflow_run.id) || new Set();
                  runArtifacts.add(artifact.name);
                  artifactsByRun.set(artifact.workflow_run.id, runArtifacts);
                }
              }

              const candidateRunIds = [...artifactsByRun.entries()]
                .filter(([, names]) => requiredNames.every((name) => names.has(name)))
                .map(([runId]) => runId);

              const candidateRuns = [];
              for (const runId of candidateRunIds) {
                if (runId === currentRunId) continue;
                const { data: run } = await github.rest.actions.getWorkflowRun({
                  owner,
                  repo,
                  run_id: runId,
                });
                candidateRuns.push(run);
              }

              const successfulRuns = candidateRuns
                .filter((run) => run.conclusion === 'success')
                .sort((left, right) =>
                  new Date(right.created_at) - new Date(left.created_at)
                );

              if (successfulRuns.length > 0) {
                const buildRun = successfulRuns[0];
                core.notice(`Using build artifacts from ${buildRun.html_url}`);
                return String(buildRun.id);
              }

              const { data: workflowRuns } = await github.rest.actions.listWorkflowRunsForRepo({
                owner,
                repo,
                per_page: 100,
              });
              const pendingBuild = workflowRuns.workflow_runs.find((run) =>
                run.id !== currentRunId &&
                run.name === context.workflow &&
                (run.head_sha === process.env.SOURCE_SHA ||
                  run.pull_requests?.some((pullRequest) =>
                    pullRequest.head?.sha === process.env.SOURCE_SHA
                  )) &&
                (run.status === 'queued' || run.status === 'in_progress')
              );

              if (!pendingBuild || Date.now() >= waitDeadline) {
                const observedCandidates = candidateRuns.length > 0
                  ? candidateRuns.map((run) => `${run.id} (${run.status}/${run.conclusion || 'pending'})`).join(', ')
                  : 'none';
                core.setFailed(
                  `No artifact run was provided and no successful build was found for commit ${process.env.SOURCE_SHA} ` +
                  `with artifacts: ${requiredNames.join(', ')}. Candidate runs: ${observedCandidates}`
                );
                return '';
              }

              core.notice(
                `Build ${pendingBuild.html_url} is still ${pendingBuild.status}; waiting for its artifacts.`
              );
              await new Promise((resolve) => setTimeout(resolve, waitIntervalMilliseconds));
            }

  app-store:
    name: Release / Integration / App Store
    needs: resolve-build-artifacts
    if: >-
      always() && !cancelled() && inputs.release-ios &&
      (inputs.delivery-mode == 'direct' || inputs.stage != 'beta' || inputs.artifact-run-id != '' ||
      needs.resolve-build-artifacts.result == 'success')
    uses: ./.github/workflows/release-integration-app-store.yml
    with:
      stage: ${{ inputs.stage }}
      delivery-mode: ${{ inputs.delivery-mode }}
      source-sha: ${{ inputs.source-sha }}
      artifact-run-id: ${{ inputs.artifact-run-id || needs.resolve-build-artifacts.outputs.run-id }}
      working-directory: ${{ inputs.working-directory }}
      flutter-version: ${{ inputs.flutter-version }}
      xcode-version: ${{ inputs.xcode-version }}
      runner: ${{ inputs.runner }}
      runner-labels: ${{ inputs.runner == 'github-hosted' && '["macos-latest"]' || inputs.runner-labels }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}

  google-play:
    name: Release / Integration / Google Play
    needs: resolve-build-artifacts
    if: >-
      always() && !cancelled() && inputs.release-android &&
      (inputs.delivery-mode == 'direct' || inputs.artifact-run-id != '' ||
      needs.resolve-build-artifacts.result == 'success')
    uses: ./.github/workflows/release-integration-google-play.yml
    with:
      stage: ${{ inputs.stage }}
      delivery-mode: ${{ inputs.delivery-mode }}
      source-sha: ${{ inputs.source-sha }}
      artifact-run-id: ${{ inputs.artifact-run-id || needs.resolve-build-artifacts.outputs.run-id }}
      working-directory: ${{ inputs.working-directory }}
      flutter-version: ${{ inputs.flutter-version }}
      java-version: ${{ inputs.java-version }}
      track: ${{ inputs.android-track }}
      app-identifier: ${{ inputs.app-identifier }}
      runner: ${{ inputs.runner }}
      runner-labels: ${{ inputs.runner == 'github-hosted' && '["ubuntu-latest"]' || inputs.runner-labels }}
    secrets:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYALIAS: ${{ secrets.KEYALIAS }}
      STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
      KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
      ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
      FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
