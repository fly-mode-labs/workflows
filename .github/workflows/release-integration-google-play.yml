name: Release integration / Google Play

on:
  workflow_call:
    inputs:
      stage: {required: true, type: string}
      artifact-run-id: {type: string, default: ''}
      working-directory: {required: true, type: string}
      flutter-version: {type: string, default: stable}
      runner-labels: {type: string, default: '["self-hosted", "macOS", "ARM64"]'}
      beta-command: {type: string, default: ./gradlew publishBundle --track internal}
      production-command: {type: string, default: ./gradlew promoteArtifact --from-track internal --promote-track production}

permissions:
  actions: read
  contents: read

jobs:
  google-play:
    name: ${{ inputs.stage == 'beta' && 'Google Play beta' || 'Google Play production' }}
    environment: ${{ inputs.stage }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v2
        if: inputs.stage == 'beta'
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/read-version@v2
        id: version
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Release Android application
        uses: Juanpabedoyav/workflows/.github/actions/flutter/release-android@v2
        with:
          stage: ${{ inputs.stage }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          working-directory: ${{ inputs.working-directory }}
          app-version: ${{ steps.version.outputs.app-version }}
          build-number: ${{ steps.version.outputs.build-number }}
          full-version: ${{ steps.version.outputs.full-version }}
          beta-command: ${{ inputs.beta-command }}
          production-command: ${{ inputs.production-command }}
