name: Release integration / Google Play

on:
  workflow_call:
    inputs:
      stage: {required: true, type: string}
      working-directory: {required: true, type: string}
      flutter-version: {type: string, default: stable}
      runner-labels: {type: string, default: '["self-hosted", "macOS", "ARM64"]'}
      beta-command: {type: string, default: ./gradlew publishBundle --track internal}
      production-command: {type: string, default: ./gradlew promoteArtifact --from-track internal --promote-track production}

permissions:
  contents: read

jobs:
  google-play:
    name: ${{ inputs.stage == 'beta' && 'Google Play beta' || 'Google Play production' }}
    environment: ${{ inputs.stage }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/setup@v1
        if: inputs.stage == 'beta'
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
      - uses: Juanpabedoyav/workflows/.github/actions/flutter/read-version@v1
        id: version
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Setup Android signing
        id: android_signing
        if: inputs.stage == 'beta'
        uses: Juanpabedoyav/workflows/.github/actions/flutter/setup-android-signing@v1
        with:
          working-directory: ${{ inputs.working-directory }}
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.KEYALIAS }}
          store-password: ${{ secrets.STOREPASSWORD }}
          key-password: ${{ secrets.KEYPASSWORD }}
      - run: flutter build appbundle --release
        if: inputs.stage == 'beta'
      - name: Upload beta to Google Play
        if: inputs.stage == 'beta'
        working-directory: ${{ inputs.working-directory }}/android
        env:
          APP_VERSION: ${{ steps.version.outputs.app-version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
          FULL_VERSION: ${{ steps.version.outputs.full-version }}
        run: ${{ inputs.beta-command }}
      - name: Promote to Google Play production
        if: inputs.stage == 'production'
        working-directory: ${{ inputs.working-directory }}/android
        env:
          APP_VERSION: ${{ steps.version.outputs.app-version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build-number }}
          FULL_VERSION: ${{ steps.version.outputs.full-version }}
        run: ${{ inputs.production-command }}
      - name: Remove temporary Android signing files
        if: ${{ always() && inputs.stage == 'beta' && steps.android_signing.outputs.configured == 'true' }}
        env:
          SIGNING_KEYSTORE_PATH: ${{ steps.android_signing.outputs.keystore-path }}
          SIGNING_PROPERTIES_PATH: ${{ steps.android_signing.outputs.properties-path }}
        run: rm -f -- "${SIGNING_KEYSTORE_PATH}" "${SIGNING_PROPERTIES_PATH}"
