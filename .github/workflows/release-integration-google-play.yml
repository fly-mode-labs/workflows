name: Release integration / Google Play

on:
  workflow_call:
    inputs:
      stage: {required: true, type: string}
      deployment-environment: {type: string, default: auto}
      github-environment: {type: string, default: ''}
      delivery-mode: {type: string, default: artifact}
      source-sha: {required: true, type: string}
      artifact-run-id: {type: string, default: ''}
      working-directory: {required: true, type: string}
      flutter-version: {type: string, default: stable}
      java-version: {type: string, default: '17'}
      runner: {type: string, default: self-hosted}
      runner-labels: {type: string, default: '["self-hosted", "macOS", "ARM64"]'}
      track: {type: string, default: alpha}
      app-identifier: {type: string, default: ''}
      android-flavor: {type: string, default: ''}
    secrets:
      PACKAGES_TOKEN: {required: false, description: GitHub token with read access to private Flutter package repositories}
      ANDROID_KEYSTORE_BASE64: {required: false, description: Base64-encoded Android signing keystore}
      KEYALIAS: {required: false, description: Android signing key alias}
      STOREPASSWORD: {required: false, description: Android signing store password}
      KEYPASSWORD: {required: false, description: Android signing key password}
      FIREBASE_SERVICE_ACCOUNT_JSON: {required: false, description: Google service-account JSON for Firebase App Distribution and Google Play}

permissions:
  actions: read
  contents: read

jobs:
  firebase-app-distribution:
    name: Firebase / Android / ${{ matrix.flavor }}
    if: >-
      inputs.stage == 'beta' &&
      ((inputs.android-flavor == 'qa') ||
      (inputs.android-flavor == 'pdn' && inputs.deployment-environment == 'production'))
    environment: ${{ inputs.github-environment != '' && inputs.github-environment || (inputs.deployment-environment != 'auto' && inputs.deployment-environment || (inputs.stage == 'beta' && 'qa' || inputs.stage)) }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.FIREBASE_ANDROID_DISTRIBUTIONS != '' && vars.FIREBASE_ANDROID_DISTRIBUTIONS != '[]' && vars.FIREBASE_ANDROID_DISTRIBUTIONS || (inputs.android-flavor == 'qa' && '[{"flavor":"qa","format":"apk"}]') || (inputs.android-flavor == 'pdn' && '[{"flavor":"pdn","format":"appbundle"}]') || '[{"flavor":"_skip_","format":"apk"}]') }}
    steps:
      - name: Validate Firebase distribution configuration
        shell: bash
        env:
          FLAVOR: ${{ matrix.flavor }}
          BUILD_FORMAT: ${{ matrix.format }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${FIREBASE_SERVICE_ACCOUNT_JSON}" ]]; then
            echo "Set the FIREBASE_SERVICE_ACCOUNT_JSON secret to enable Firebase App Distribution." >&2
            exit 1
          fi
          if [[ -z "${FLAVOR}" ]]; then
            echo "Each Firebase Android distribution requires a non-empty flavor." >&2
            exit 1
          fi
          case "${BUILD_FORMAT}" in
            apk|appbundle) ;;
            *) echo "Unsupported Firebase Android format: ${BUILD_FORMAT}" >&2; exit 1 ;;
          esac
      - name: Checkout application source
        if: inputs.delivery-mode == 'direct'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false
      - name: Download Android build artifact
        if: inputs.delivery-mode == 'artifact'
        id: artifact
        uses: actions/download-artifact@v8
        with:
          pattern: android-*-${{ inputs.source-sha }}
          path: ${{ runner.temp }}/firebase-android-${{ github.run_id }}
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.artifact-run-id }}
      - name: Setup hosted Android JDK
        if: inputs.delivery-mode == 'direct' && inputs.runner == 'github-hosted'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Select hosted JDK for Gradle
        if: inputs.delivery-mode == 'direct' && inputs.runner == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${JAVA_HOME:-}" || ! -x "${JAVA_HOME}/bin/java" ]]; then
            echo "The hosted JDK was not installed correctly: JAVA_HOME=${JAVA_HOME:-<unset>}" >&2
            exit 1
          fi
          echo "GRADLE_OPTS=${GRADLE_OPTS:-} -Dorg.gradle.java.home=${JAVA_HOME}" >> "${GITHUB_ENV}"
      - name: Setup Flutter SDK and dependencies
        if: inputs.delivery-mode == 'direct'
        uses: fly-mode-labs/workflows/.github/actions/flutter/setup@main
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
          packages-token: ${{ secrets.PACKAGES_TOKEN }}
      - name: Read application version
        if: inputs.delivery-mode == 'direct'
        id: version
        uses: fly-mode-labs/workflows/.github/actions/flutter/read-version@main
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Build flavored Android distribution
        if: inputs.delivery-mode == 'direct'
        id: build
        uses: fly-mode-labs/workflows/.github/actions/flutter/build-android@main
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
          build-format: ${{ matrix.format }}
          flavor: ${{ matrix.flavor }}
          upload-artifact: 'false'
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.KEYALIAS }}
          store-password: ${{ secrets.STOREPASSWORD }}
          key-password: ${{ secrets.KEYPASSWORD }}
      - name: Resolve Firebase distribution artifact
        id: distribution
        shell: bash
        env:
          DELIVERY_MODE: ${{ inputs.delivery-mode }}
          BUILD_FORMAT: ${{ matrix.format }}
          ARTIFACT_DIRECTORY: ${{ steps.artifact.outputs.download-path }}
          LOCAL_PACKAGE_NAME: ${{ steps.build.outputs.package-name }}
          LOCAL_APK_PATH: ${{ steps.build.outputs.apk-path }}
          LOCAL_AAB_PATH: ${{ steps.build.outputs.aab-path }}
        run: |
          set -euo pipefail

          case "${BUILD_FORMAT}" in
            apk|appbundle) ;;
            *) echo "Unsupported Firebase Android format: ${BUILD_FORMAT}" >&2; exit 1 ;;
          esac

          if [[ "${DELIVERY_MODE}" == 'direct' ]]; then
            package_name="${LOCAL_PACKAGE_NAME}"
            if [[ "${BUILD_FORMAT}" == 'apk' ]]; then
              file_path="${LOCAL_APK_PATH}"
            else
              file_path="${LOCAL_AAB_PATH}"
            fi
          else
            package_name_file=''
            package_name_file_count=0
            while IFS= read -r candidate; do
              package_name_file="${candidate}"
              package_name_file_count=$((package_name_file_count + 1))
            done < <(find "${ARTIFACT_DIRECTORY}" -type f -name android-package-name.txt -print)
            if [[ "${package_name_file_count}" -ne 1 ]]; then
              echo "Expected exactly one Android package-name file, found ${package_name_file_count}." >&2
              exit 1
            fi
            package_name="$(tr -d '\r\n' < "${package_name_file}")"

            extension='aab'
            [[ "${BUILD_FORMAT}" == 'apk' ]] && extension='apk'
            file_path=''
            file_count=0
            while IFS= read -r candidate; do
              file_path="${candidate}"
              file_count=$((file_count + 1))
            done < <(find "${ARTIFACT_DIRECTORY}" -type f -name "*.${extension}" -print)
            if [[ "${file_count}" -ne 1 ]]; then
              echo "Expected one Android .${extension} artifact, found ${file_count}." >&2
              exit 1
            fi
          fi

          if [[ -z "${package_name}" || -z "${file_path}" || ! -f "${file_path}" ]]; then
            echo "Could not resolve the Firebase Android artifact and package metadata." >&2
            exit 1
          fi
          echo "package-name=${package_name}" >> "${GITHUB_OUTPUT}"
          echo "file-path=${file_path}" >> "${GITHUB_OUTPUT}"
      - name: Authenticate to Firebase Management API
        id: firebase-auth
        # v3
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/cloud-platform.read-only
          create_credentials_file: false
          export_environment_variables: false
      - name: Resolve Firebase App ID from Android package name
        id: firebase-app
        shell: bash
        env:
          ACCESS_TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ANDROID_PACKAGE_NAME: ${{ steps.distribution.outputs.package-name }}
          CONFIGURED_PROJECT_ID: ${{ matrix.project_id }}
        run: |
          set -euo pipefail

          service_account_project_id="$(jq -r '.project_id // empty' <<< "${SERVICE_ACCOUNT_JSON}")"
          project_id="${CONFIGURED_PROJECT_ID:-${service_account_project_id}}"
          if [[ -z "${project_id}" || -z "${ANDROID_PACKAGE_NAME}" ]]; then
            echo "Could not resolve Firebase project ID or Android package name." >&2
            exit 1
          fi

          apps='[]'
          page_token=''
          while true; do
            query_args=(--data-urlencode 'pageSize=100')
            if [[ -n "${page_token}" ]]; then
              query_args+=(--data-urlencode "pageToken=${page_token}")
            fi
            response="$(curl --fail --silent --show-error --get \
              --header "Authorization: Bearer ${ACCESS_TOKEN}" \
              "${query_args[@]}" \
              "https://firebase.googleapis.com/v1beta1/projects/${project_id}/androidApps")"
            apps="$(jq -cn --argjson previous "${apps}" --argjson response "${response}" \
              '$previous + ($response.apps // [])')"
            page_token="$(jq -r '.nextPageToken // empty' <<< "${response}")"
            if [[ -z "${page_token}" ]]; then
              break
            fi
          done

          app_ids="$(jq -c --arg package "${ANDROID_PACKAGE_NAME}" \
            '[.[] | select(.packageName == $package and .state == "ACTIVE") | .appId] | unique' \
            <<< "${apps}")"
          app_count="$(jq 'length' <<< "${app_ids}")"
          if [[ "${app_count}" -ne 1 ]]; then
            echo "Expected exactly one active Firebase Android app for package ${ANDROID_PACKAGE_NAME} in project ${project_id}, found ${app_count}." >&2
            exit 1
          fi

          echo "app-id=$(jq -r '.[0]' <<< "${app_ids}")" >> "${GITHUB_OUTPUT}"
      - name: Distribute Android flavor to Firebase App Distribution
        uses: fly-mode-labs/workflows/.github/actions/flutter/firebase-app-distribution@main
        with:
          app-id: ${{ steps.firebase-app.outputs.app-id }}
          service-account-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          file: ${{ steps.distribution.outputs.file-path }}
          groups: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
      - name: Remove local Android build outputs
        if: always() && inputs.delivery-mode == 'direct'
        shell: bash
        env:
          APPLICATION_DIRECTORY: ${{ inputs.working-directory }}
        run: rm -rf -- "${APPLICATION_DIRECTORY}/build/app/outputs/flutter-apk" "${APPLICATION_DIRECTORY}/build/app/outputs/bundle" "${APPLICATION_DIRECTORY}/build/app/outputs/pipeline-metadata"

  google-play:
    name: Google Play
    if: >-
      inputs.stage != 'beta' || inputs.android-flavor != 'qa'
    environment: ${{ inputs.github-environment != '' && inputs.github-environment || (inputs.deployment-environment != 'auto' && inputs.deployment-environment || (inputs.stage == 'beta' && 'qa' || inputs.stage)) }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: ${{ inputs.stage == 'beta' && inputs.delivery-mode == 'direct' && 75 || 45 }}
    steps:
      - name: Checkout application
        if: inputs.delivery-mode == 'direct'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup hosted Android JDK
        if: inputs.stage == 'beta' && inputs.delivery-mode == 'direct' && inputs.runner == 'github-hosted'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
      - name: Select hosted JDK for Gradle
        if: inputs.stage == 'beta' && inputs.delivery-mode == 'direct' && inputs.runner == 'github-hosted'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${JAVA_HOME:-}" || ! -x "${JAVA_HOME}/bin/java" ]]; then
            echo "The hosted JDK was not installed correctly: JAVA_HOME=${JAVA_HOME:-<unset>}" >&2
            exit 1
          fi
          echo "GRADLE_OPTS=${GRADLE_OPTS:-} -Dorg.gradle.java.home=${JAVA_HOME}" >> "${GITHUB_ENV}"
      - name: Setup Flutter SDK and dependencies
        if: inputs.stage == 'beta' && inputs.delivery-mode == 'direct'
        uses: fly-mode-labs/workflows/.github/actions/flutter/setup@main
        with:
          flutter-version: ${{ inputs.flutter-version }}
          working-directory: ${{ inputs.working-directory }}
          packages-token: ${{ secrets.PACKAGES_TOKEN }}
      - name: Read application version for direct delivery
        if: inputs.delivery-mode == 'direct'
        id: version
        uses: fly-mode-labs/workflows/.github/actions/flutter/read-version@main
        with:
          working-directory: ${{ inputs.working-directory }}
      - name: Build App Bundle for direct beta delivery
        if: inputs.stage == 'beta' && inputs.delivery-mode == 'direct'
        id: build
        uses: fly-mode-labs/workflows/.github/actions/flutter/build-android@main
        with:
          working-directory: ${{ inputs.working-directory }}
          full-version: ${{ steps.version.outputs.full-version }}
          build-format: appbundle
          flavor: ${{ inputs.android-flavor }}
          upload-artifact: 'false'
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          key-alias: ${{ secrets.KEYALIAS }}
          store-password: ${{ secrets.STOREPASSWORD }}
          key-password: ${{ secrets.KEYPASSWORD }}
      - name: Release Android application
        uses: fly-mode-labs/workflows/.github/actions/flutter/release-android@main
        with:
          stage: ${{ inputs.stage }}
          delivery-mode: ${{ inputs.delivery-mode }}
          source-sha: ${{ inputs.source-sha }}
          artifact-run-id: ${{ inputs.artifact-run-id }}
          working-directory: ${{ inputs.working-directory }}
          track: ${{ inputs.track }}
          identifier: ${{ inputs.app-identifier || vars.APP_IDENTIFIER }}
          local-aab-path: ${{ steps.build.outputs.aab-path }}
          local-package-name: ${{ steps.build.outputs.package-name }}
          version-code: ${{ steps.version.outputs.build-number }}
          service-account-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          firebase-app-id: ${{ (inputs.android-flavor != 'qa' && !(inputs.android-flavor == 'pdn' && inputs.deployment-environment == 'production') && (vars.FIREBASE_ANDROID_DISTRIBUTIONS == '' || vars.FIREBASE_ANDROID_DISTRIBUTIONS == '[]')) && vars.FIREBASE_APP_ID_ANDROID || '' }}
          firebase-service-account-json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          firebase-groups: ${{ vars.FIREBASE_APP_DISTRIBUTION_GROUPS }}
      - name: Remove direct Android beta binaries
        if: always() && inputs.stage == 'beta' && inputs.delivery-mode == 'direct'
        shell: bash
        run: rm -rf -- "${{ inputs.working-directory }}/build/app/outputs/bundle" "${{ inputs.working-directory }}/build/app/outputs/pipeline-metadata"
