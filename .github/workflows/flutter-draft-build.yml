name: Flutter / Draft build

on:
  workflow_call:
    inputs:
      flutter-version:
        type: string
        default: stable
      working-directory:
        type: string
        default: .
      runner-labels:
        description: JSON array of self-hosted runner labels
        type: string
        default: '["self-hosted", "macOS", "ARM64"]'
      artifact-retention-days:
        type: number
        default: 14

permissions:
  contents: read

concurrency:
  group: flutter-draft-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned artifacts
    outputs:
      app-version: ${{ steps.app-version.outputs.app-version }}
      build-number: ${{ steps.app-version.outputs.build-number }}
    runs-on: ${{ fromJSON(inputs.runner-labels) }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - name: Read version from pubspec.yaml
        id: app-version
        shell: bash
        run: |
          full_version="$(sed -nE 's/^version:[[:space:]]*([^[:space:]#]+).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ ! "${full_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+[0-9]+$ ]]; then
            echo "pubspec.yaml must contain version: MAJOR.MINOR.PATCH+BUILD_NUMBER"
            exit 1
          fi
          echo "full-version=${full_version}" >> "${GITHUB_OUTPUT}"
          echo "app-version=${full_version%%+*}" >> "${GITHUB_OUTPUT}"
          echo "build-number=${full_version##*+}" >> "${GITHUB_OUTPUT}"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter-version }}
          channel: ${{ inputs.flutter-version == 'stable' && 'stable' || '' }}
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Android artifacts
        run: |
          flutter build apk --release
          flutter build appbundle --release
      - name: Build unsigned iOS archive
        run: flutter build ipa --release --no-codesign
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ steps.app-version.outputs.full-version }}-${{ github.sha }}
          path: |
            ${{ inputs.working-directory }}/build/app/outputs/flutter-apk/*.apk
            ${{ inputs.working-directory }}/build/app/outputs/bundle/**/*.aab
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error
      - name: Upload iOS archive
        uses: actions/upload-artifact@v4
        with:
          name: ios-${{ steps.app-version.outputs.full-version }}-${{ github.sha }}
          path: ${{ inputs.working-directory }}/build/ios/archive/*.xcarchive
          retention-days: ${{ inputs.artifact-retention-days }}
          if-no-files-found: error
