name: Release Flutter iOS
description: Distributes a built IPA to TestFlight or promotes it to App Store production.

inputs:
  stage: {required: true, description: beta or production}
  delivery-mode: {required: false, default: artifact, description: artifact or direct}
  source-sha: {required: false, default: '', description: Exact source commit represented by the store build}
  source-provenance-supported: {required: false, default: '', description: Consumer attestation that iOS lanes enforce SOURCE_SHA provenance}
  artifact-run-id: {required: false, default: '', description: Workflow run containing the IPA}
  ipa-path: {required: false, default: '', description: Local IPA path used for direct beta delivery}
  working-directory: {required: true, description: Flutter application directory}
  runner: {required: false, default: self-hosted, description: Runner provider; self-hosted or github-hosted}
  app-version: {required: true, description: Semantic application version}
  build-number: {required: true, description: Store build number}
  full-version: {required: true, description: Complete Flutter version}
  app-store-connect-api-key-base64: {required: true, description: Base64-encoded App Store Connect API private key}
  app-store-connect-issuer-id: {required: true, description: App Store Connect API issuer ID}
  app-store-connect-key-id: {required: true, description: App Store Connect API key ID}
  app-store-locale: {required: false, default: '', description: App Store locale used for release metadata}
  app-store-description: {required: false, default: '', description: Localized App Store description}
  app-store-keywords: {required: false, default: '', description: Comma-separated localized App Store keywords}
  app-store-support-url: {required: false, default: '', description: Localized App Store support URL}
  app-store-release-notes: {required: false, default: '', description: Localized App Store release notes}
  beta-command: {required: false, default: bundle exec fastlane ios beta, description: Command that uploads the IPA to TestFlight}
  production-command: {required: false, default: bundle exec fastlane ios release, description: Command that promotes the beta to production}

runs:
  using: composite
  steps:
    - name: Validate direct iOS source provenance contract
      if: inputs.delivery-mode == 'direct'
      shell: bash
      env:
        SOURCE_SHA: ${{ inputs.source-sha }}
        SOURCE_PROVENANCE_SUPPORTED: ${{ inputs.source-provenance-supported }}
      run: |
        set -euo pipefail
        if [[ ! "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Direct iOS delivery requires the exact 40-character source SHA." >&2
          exit 1
        fi
        if [[ "${SOURCE_PROVENANCE_SUPPORTED}" != 'true' ]]; then
          echo "Direct iOS delivery requires IOS_SOURCE_PROVENANCE_SUPPORTED=true after both Fastlane lanes implement the SOURCE_SHA contract." >&2
          exit 1
        fi

    - name: Validate App Store Connect API credentials
      shell: bash
      env:
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ inputs.app-store-connect-api-key-base64 }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.app-store-connect-issuer-id }}
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.app-store-connect-key-id }}
      run: |
        set -euo pipefail

        missing=()
        [[ -n "${APP_STORE_CONNECT_API_KEY_BASE64}" ]] || missing+=(APP_STORE_CONNECT_API_KEY_BASE64)
        [[ -n "${APP_STORE_CONNECT_ISSUER_ID}" ]] || missing+=(APP_STORE_CONNECT_ISSUER_ID)
        [[ -n "${APP_STORE_CONNECT_KEY_ID}" ]] || missing+=(APP_STORE_CONNECT_KEY_ID)

        if [[ "${#missing[@]}" -ne 0 ]]; then
          printf 'Missing required App Store Connect secrets: %s\n' "${missing[*]}" >&2
          exit 1
        fi

    - name: Validate App Store metadata
      if: inputs.stage == 'production'
      shell: bash
      env:
        APP_STORE_LOCALE: ${{ inputs.app-store-locale }}
        APP_STORE_DESCRIPTION: ${{ inputs.app-store-description }}
        APP_STORE_KEYWORDS: ${{ inputs.app-store-keywords }}
        APP_STORE_SUPPORT_URL: ${{ inputs.app-store-support-url }}
        APP_STORE_RELEASE_NOTES: ${{ inputs.app-store-release-notes }}
      run: |
        set -euo pipefail

        missing=()
        [[ -n "${APP_STORE_LOCALE}" ]] || missing+=(APP_STORE_LOCALE)
        [[ -n "${APP_STORE_DESCRIPTION}" ]] || missing+=(APP_STORE_DESCRIPTION)
        [[ -n "${APP_STORE_KEYWORDS}" ]] || missing+=(APP_STORE_KEYWORDS)
        [[ -n "${APP_STORE_SUPPORT_URL}" ]] || missing+=(APP_STORE_SUPPORT_URL)
        [[ -n "${APP_STORE_RELEASE_NOTES}" ]] || missing+=(APP_STORE_RELEASE_NOTES)

        if [[ "${#missing[@]}" -ne 0 ]]; then
          printf 'Missing required App Store Repository Variables: %s\n' "${missing[*]}" >&2
          exit 1
        fi

    - name: Stage localized App Store metadata
      if: inputs.stage == 'production'
      id: metadata
      shell: bash
      env:
        APP_STORE_LOCALE: ${{ inputs.app-store-locale }}
        APP_STORE_DESCRIPTION: ${{ inputs.app-store-description }}
        APP_STORE_KEYWORDS: ${{ inputs.app-store-keywords }}
        APP_STORE_SUPPORT_URL: ${{ inputs.app-store-support-url }}
        APP_STORE_RELEASE_NOTES: ${{ inputs.app-store-release-notes }}
        METADATA_SCRIPT: ${{ github.action_path }}/stage-metadata.sh
      run: bash "${METADATA_SCRIPT}"

    - name: Download signed iOS artifact
      if: inputs.stage == 'beta' && inputs.delivery-mode == 'artifact'
      uses: actions/download-artifact@v4
      with:
        name: ios-${{ inputs.full-version }}-${{ github.event.pull_request.head.sha || github.sha }}
        path: ${{ runner.temp }}/ios-${{ github.run_id }}
        github-token: ${{ github.token }}
        run-id: ${{ inputs.artifact-run-id }}
    - name: Resolve beta IPA
      if: inputs.stage == 'beta'
      id: artifact
      shell: bash
      env:
        DELIVERY_MODE: ${{ inputs.delivery-mode }}
        LOCAL_IPA_PATH: ${{ inputs.ipa-path }}
        ARTIFACT_DIRECTORY: ${{ runner.temp }}/ios-${{ github.run_id }}
      run: |
        set -euo pipefail

        if [[ "${DELIVERY_MODE}" == 'direct' ]]; then
          if [[ -z "${LOCAL_IPA_PATH}" || ! -f "${LOCAL_IPA_PATH}" ]]; then
            echo "Direct iOS delivery requires an existing local IPA path." >&2
            exit 1
          fi
          if [[ "${LOCAL_IPA_PATH}" != *.ipa ]]; then
            echo "Direct iOS delivery received a non-IPA path: ${LOCAL_IPA_PATH}" >&2
            exit 1
          fi
          echo "ipa-path=${LOCAL_IPA_PATH}" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        ipa_path=''
        ipa_count=0
        while IFS= read -r candidate; do
          ipa_path="${candidate}"
          ipa_count=$((ipa_count + 1))
        done < <(find "${ARTIFACT_DIRECTORY}" -type f -name '*.ipa' -print)

        if [[ "${ipa_count}" -ne 1 ]]; then
          echo "Expected exactly one IPA in the build artifact, found ${ipa_count}." >&2
          exit 1
        fi

        echo "ipa-path=${ipa_path}" >> "${GITHUB_OUTPUT}"
    - name: Setup hosted Ruby, Bundler and gem cache
      if: inputs.runner == 'github-hosted'
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        working-directory: ${{ inputs.working-directory }}
        bundler-cache: true
    - name: Install iOS release dependencies on the self-hosted runner
      if: inputs.runner == 'self-hosted'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: bundle install
    - name: Upload beta to TestFlight
      if: inputs.stage == 'beta'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ inputs.app-store-connect-api-key-base64 }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.app-store-connect-issuer-id }}
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.app-store-connect-key-id }}
        APP_VERSION: ${{ inputs.app-version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        FULL_VERSION: ${{ inputs.full-version }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        IPA_PATH: ${{ steps.artifact.outputs.ipa-path }}
        FASTLANE_SKIP_UPDATE_CHECK: '1'
      run: ${{ inputs.beta-command }}
    - name: Promote to App Store
      if: inputs.stage == 'production'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        APP_STORE_CONNECT_API_KEY_BASE64: ${{ inputs.app-store-connect-api-key-base64 }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ inputs.app-store-connect-issuer-id }}
        APP_STORE_CONNECT_KEY_ID: ${{ inputs.app-store-connect-key-id }}
        APP_STORE_LOCALE: ${{ inputs.app-store-locale }}
        APP_STORE_DESCRIPTION: ${{ inputs.app-store-description }}
        APP_STORE_KEYWORDS: ${{ inputs.app-store-keywords }}
        APP_STORE_SUPPORT_URL: ${{ inputs.app-store-support-url }}
        APP_STORE_RELEASE_NOTES: ${{ inputs.app-store-release-notes }}
        DELIVER_METADATA_PATH: ${{ steps.metadata.outputs.path }}
        APP_VERSION: ${{ inputs.app-version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        FULL_VERSION: ${{ inputs.full-version }}
        SOURCE_SHA: ${{ inputs.source-sha }}
        FASTLANE_SKIP_UPDATE_CHECK: '1'
      run: ${{ inputs.production-command }}
