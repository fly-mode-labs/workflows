name: Build Flutter Android
description: Builds and uploads the selected Android release artifacts.

inputs:
  working-directory: {required: true, description: Flutter application directory}
  full-version: {required: true, description: Full pubspec version}
  build-format: {required: false, default: both, description: apk, appbundle or both}
  keystore-base64: {required: false, description: Base64-encoded Android keystore}
  key-alias: {required: false, description: Android signing key alias}
  store-password: {required: false, description: Android keystore password}
  key-password: {required: false, description: Android signing key password}

runs:
  using: composite
  steps:
    - name: Prepare Gradle build state
      shell: bash
      working-directory: ${{ inputs.working-directory }}/android
      run: |
        set -euo pipefail

        minimum_kb=$((5 * 1024 * 1024))
        gradle_project_cache=".gradle/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"

        # A cancelled build can leave this run-specific cache behind. Remove it
        # before measuring the space available for the replacement build.
        rm -rf -- "${gradle_project_cache}"
        available_kb="$(df -Pk . | awk 'NR == 2 { print $4 }')"

        # v2.3.3 moved Flutter from RUNNER_TOOL_CACHE to RUNNER_TEMP so a
        # cancelled install cannot leave a broken persistent SDK behind. Remove
        # that now-unused legacy copy only when the runner needs the space. The
        # active SDK is protected by checking FLUTTER_ROOT first.
        legacy_flutter_cache="${RUNNER_TOOL_CACHE}/flutter"
        if (( available_kb < minimum_kb )) &&
          [[ -d "${legacy_flutter_cache}" ]] &&
          [[ "${FLUTTER_ROOT}" != "${legacy_flutter_cache}"/* ]]; then
          echo "Low disk space; removing unused legacy Flutter tool cache: ${legacy_flutter_cache}"
          rm -rf -- "${legacy_flutter_cache}"
          available_kb="$(df -Pk . | awk 'NR == 2 { print $4 }')"
        fi

        # Gradle's version-specific transform and execution caches can consume
        # several GiB on a self-hosted runner. They are safe to regenerate.
        # Keep downloaded dependency modules and wrapper distributions so the
        # next build does not need to download the whole toolchain again.
        gradle_user_home="${GRADLE_USER_HOME:-${HOME}/.gradle}"
        gradle_caches="${gradle_user_home%/}/caches"
        if (( available_kb < minimum_kb )) && [[ -d "${gradle_caches}" ]]; then
          echo "Low disk space; removing regenerable Gradle caches from: ${gradle_caches}"
          ./gradlew --stop || true
          find "${gradle_caches}" -mindepth 1 -maxdepth 1 \
            ! -name modules-2 \
            ! -name CACHEDIR.TAG \
            -exec rm -rf -- {} +
          available_kb="$(df -Pk . | awk 'NR == 2 { print $4 }')"
        fi

        if (( available_kb < minimum_kb )); then
          echo "Android release builds require at least 5 GiB of free disk space; only $((available_kb / 1024)) MiB is available." >&2
          df -h .
          exit 1
        fi

        echo "GRADLE_PROJECT_CACHE_DIR=${gradle_project_cache}" >> "${GITHUB_ENV}"
        echo "GRADLE_OPTS=${GRADLE_OPTS:-} -Dorg.gradle.daemon=false -Dorg.gradle.projectcachedir=${gradle_project_cache}" >> "${GITHUB_ENV}"

        echo "Gradle project cache: ${PWD}/${gradle_project_cache}"
        echo "Gradle daemon: disabled for this CI build"
    - name: Setup Android signing
      id: android_signing
      uses: Juanpabedoyav/workflows/.github/actions/flutter/setup-android-signing@v3.4.11
      with:
        working-directory: ${{ inputs.working-directory }}
        keystore-base64: ${{ inputs.keystore-base64 }}
        key-alias: ${{ inputs.key-alias }}
        store-password: ${{ inputs.store-password }}
        key-password: ${{ inputs.key-password }}
    - name: Compile release APK
      if: inputs.build-format == 'apk' || inputs.build-format == 'both'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter build apk --release
    - name: Compile release Android App Bundle
      if: inputs.build-format == 'appbundle' || inputs.build-format == 'both'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter build appbundle --release
    - name: Export Android application identifier
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        metadata_directory="build/app/outputs/pipeline-metadata"
        package_name_file="${metadata_directory}/android-package-name.txt"
        mkdir -p "${metadata_directory}"

        find build/app/intermediates -type f -name output-metadata.json \
          -exec jq -r '.applicationId // empty' {} + |
          sed '/^$/d' |
          sort -u > "${package_name_file}"

        package_name_count="$(wc -l < "${package_name_file}" | tr -d ' ')"
        if [[ "${package_name_count}" -ne 1 ]]; then
          echo "Expected one Android application ID in AGP output metadata, found ${package_name_count}." >&2
          exit 1
        fi

        echo "Android application ID: $(< "${package_name_file}")"
    - name: Remove Gradle CI project cache
      if: always()
      shell: bash
      working-directory: ${{ inputs.working-directory }}/android
      run: |
        set -euo pipefail
        gradle_project_cache=".gradle/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}"
        rm -rf -- "${gradle_project_cache}"
    - name: Upload Android artifacts
      uses: actions/upload-artifact@v7
      with:
        name: android-${{ inputs.full-version }}-${{ github.event.pull_request.head.sha || github.sha }}
        path: |
          ${{ inputs.working-directory }}/build/app/outputs/flutter-apk/*.apk
          ${{ inputs.working-directory }}/build/app/outputs/bundle/**/*.aab
          ${{ inputs.working-directory }}/build/app/outputs/pipeline-metadata/android-package-name.txt
        retention-days: 14
        if-no-files-found: error
        overwrite: true
        compression-level: 0
    - name: Remove temporary Android signing files
      if: ${{ always() && steps.android_signing.outputs.configured == 'true' }}
      shell: bash
      env:
        SIGNING_KEYSTORE_PATH: ${{ steps.android_signing.outputs.keystore-path }}
        SIGNING_PROPERTIES_PATH: ${{ steps.android_signing.outputs.properties-path }}
      run: rm -f -- "${SIGNING_KEYSTORE_PATH}" "${SIGNING_PROPERTIES_PATH}"
