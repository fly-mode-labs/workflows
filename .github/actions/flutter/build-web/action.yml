name: Build Flutter Web
description: Builds and uploads the Flutter Web bundle.

inputs:
  working-directory: {required: true, description: Flutter application directory}
  full-version: {required: true, description: Full pubspec version}

runs:
  using: composite
  steps:
    - name: Compile Web bundle
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter build web --release
    - name: Upload Web bundle
      uses: actions/upload-artifact@v4
      with:
        name: web-${{ inputs.full-version }}-${{ github.sha }}
        path: ${{ inputs.working-directory }}/build/web
        retention-days: 14
        if-no-files-found: error
