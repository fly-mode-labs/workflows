name: Build Flutter iOS
description: Builds a signed IPA and optionally uploads it as an artifact.

inputs:
  working-directory: {required: true, description: Flutter application directory}
  full-version: {required: true, description: Full pubspec version}
  upload-artifact: {required: false, default: 'true', description: Whether to upload the IPA as a GitHub artifact}
  cleanup-output: {required: false, default: 'false', description: Whether to remove local signed outputs before the action exits}
  runtime-config-json: {required: false, default: '', description: Public flat AppConfig JSON; do not pass credentials or secrets}
  runner: {required: false, default: self-hosted, description: Runner provider; self-hosted or github-hosted}
  match-password: {required: false, description: Match repository encryption password}
  match-git-basic-authorization: {required: false, description: Base64 Git authorization for Match}
  match-type: {required: false, default: appstore, description: Match profile type}
  app-store-connect-api-key-base64: {required: false, description: Base64 App Store Connect API key for first-time Match initialization}
  app-store-connect-issuer-id: {required: false, description: App Store Connect API issuer ID for first-time Match initialization}
  app-store-connect-key-id: {required: false, description: App Store Connect API key ID for first-time Match initialization}

outputs:
  ipa-path:
    description: Absolute path to the single generated IPA
    value: ${{ steps.ipa.outputs.ipa-path }}

runs:
  using: composite
  steps:
    - name: Prepare compile-time application configuration
      id: app_config
      shell: bash
      env:
        APP_RUNTIME_CONFIG_JSON: ${{ inputs.runtime-config-json }}
      run: |
        set -euo pipefail

        if [[ -z "${APP_RUNTIME_CONFIG_JSON}" ]]; then
          echo "path=" >> "${GITHUB_OUTPUT}"
          exit 0
        fi

        if ! printf '%s' "${APP_RUNTIME_CONFIG_JSON}" | jq -e '
          type == "object" and
          (.productId | type == "string" and length > 0) and
          (.environment | type == "string" and length > 0) and
          (.apiUrl | type == "string" and test("^https?://[^[:space:]]+$")) and
          (.schemaVersion | type == "number" and . >= 1 and . <= 2) and
          all(keys[]; test("(?i)(secret|password|token|credential|private)") | not)
        ' > /dev/null; then
          echo "APP_RUNTIME_CONFIG_JSON must be public AppConfig JSON without credentials or secrets." >&2
          exit 1
        fi

        runtime_config_path="${RUNNER_TEMP}/app-runtime-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_JOB}.json"
        printf '%s' "${APP_RUNTIME_CONFIG_JSON}" > "${runtime_config_path}"
        echo "path=${runtime_config_path}" >> "${GITHUB_OUTPUT}"
    - name: Setup iOS signing with Match
      id: ios_signing
      uses: fly-mode-labs/workflows/.github/actions/flutter/setup-ios-signing@main
      with:
        working-directory: ${{ inputs.working-directory }}
        runner: ${{ inputs.runner }}
        match-password: ${{ inputs.match-password }}
        match-git-basic-authorization: ${{ inputs.match-git-basic-authorization }}
        match-type: ${{ inputs.match-type }}
        app-store-connect-api-key-base64: ${{ inputs.app-store-connect-api-key-base64 }}
        app-store-connect-issuer-id: ${{ inputs.app-store-connect-issuer-id }}
        app-store-connect-key-id: ${{ inputs.app-store-connect-key-id }}
    - name: Compile signed iOS archive
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        IOS_SIGNING_CONFIGURED: ${{ steps.ios_signing.outputs.configured }}
        IOS_BUNDLE_IDENTIFIER: ${{ steps.ios_signing.outputs.bundle-identifier }}
        IOS_TEAM_ID: ${{ steps.ios_signing.outputs.team-id }}
        IOS_PROFILE_NAME: ${{ steps.ios_signing.outputs.profile-name }}
        IOS_CODE_SIGN_IDENTITY: ${{ steps.ios_signing.outputs.code-sign-identity }}
        IOS_EXPORT_METHOD: ${{ steps.ios_signing.outputs.export-method }}
        DART_DEFINE_FILE: ${{ steps.app_config.outputs.path }}
      run: |
        set -euo pipefail

        build_args=(build ipa --release)
        if [[ -n "${DART_DEFINE_FILE}" ]]; then
          build_args+=(--dart-define-from-file="${DART_DEFINE_FILE}")
        fi

        if [[ "${IOS_SIGNING_CONFIGURED}" != 'true' ]]; then
          flutter "${build_args[@]}"
          exit 0
        fi

        signing_values=(
          IOS_BUNDLE_IDENTIFIER
          IOS_TEAM_ID
          IOS_PROFILE_NAME
          IOS_CODE_SIGN_IDENTITY
          IOS_EXPORT_METHOD
        )
        for variable_name in "${signing_values[@]}"; do
          if [[ -z "${!variable_name:-}" ]]; then
            echo "Match signing did not resolve ${variable_name}." >&2
            exit 1
          fi
        done

        bundle exec fastlane run update_code_signing_settings \
          path:ios/Runner.xcodeproj \
          use_automatic_signing:false \
          targets:Runner \
          build_configurations:Release \
          team_id:"${IOS_TEAM_ID}" \
          code_sign_identity:"${IOS_CODE_SIGN_IDENTITY}" \
          profile_name:"${IOS_PROFILE_NAME}"

        export_options_plist="$(mktemp "${RUNNER_TEMP}/ExportOptions.XXXXXX")"
        trap 'rm -f -- "${export_options_plist}"' EXIT
        plutil -create xml1 "${export_options_plist}"
        /usr/libexec/PlistBuddy \
          -c "Add :method string ${IOS_EXPORT_METHOD}" \
          "${export_options_plist}"
        /usr/libexec/PlistBuddy \
          -c 'Add :signingStyle string manual' \
          "${export_options_plist}"
        /usr/libexec/PlistBuddy \
          -c "Add :teamID string ${IOS_TEAM_ID}" \
          "${export_options_plist}"
        /usr/libexec/PlistBuddy \
          -c "Add :signingCertificate string ${IOS_CODE_SIGN_IDENTITY}" \
          "${export_options_plist}"
        /usr/libexec/PlistBuddy \
          -c 'Add :provisioningProfiles dict' \
          "${export_options_plist}"
        /usr/libexec/PlistBuddy \
          -c "Add :provisioningProfiles:${IOS_BUNDLE_IDENTIFIER} string ${IOS_PROFILE_NAME}" \
          "${export_options_plist}"

        echo "Signing Runner (${IOS_BUNDLE_IDENTIFIER}) manually with ${IOS_CODE_SIGN_IDENTITY} and profile '${IOS_PROFILE_NAME}'."
        flutter "${build_args[@]}" \
          --export-options-plist="${export_options_plist}"
    - name: Resolve signed IPA
      id: ipa
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        ipa_path=''
        ipa_count=0
        while IFS= read -r candidate; do
          ipa_path="${candidate}"
          ipa_count=$((ipa_count + 1))
        done < <(find build/ios/ipa -type f -name '*.ipa' -print)

        if [[ "${ipa_count}" -ne 1 ]]; then
          echo "Expected exactly one signed IPA, found ${ipa_count}." >&2
          exit 1
        fi

        echo "ipa-path=${PWD}/${ipa_path}" >> "${GITHUB_OUTPUT}"
    - name: Upload iOS artifacts
      if: inputs.upload-artifact == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ios-${{ inputs.full-version }}-${{ github.event.pull_request.head.sha || github.sha }}
        path: |
          ${{ inputs.working-directory }}/build/ios/archive/*.xcarchive
          ${{ inputs.working-directory }}/build/ios/ipa/*.ipa
        retention-days: 14
        if-no-files-found: error
        overwrite: true
    - name: Remove temporary compile-time application configuration
      if: always() && steps.app_config.outputs.path != ''
      shell: bash
      env:
        APP_RUNTIME_CONFIG_PATH: ${{ steps.app_config.outputs.path }}
      run: rm -f -- "${APP_RUNTIME_CONFIG_PATH}"
    - name: Remove temporary iOS signing assets
      if: always() && steps.ios_signing.outputs.configured == 'true'
      shell: bash
      env:
        KEYCHAIN_NAME: ${{ steps.ios_signing.outputs.keychain-name }}
        ORIGINAL_DEFAULT_KEYCHAIN: ${{ steps.ios_signing.outputs.original-default-keychain }}
        PROFILES_BEFORE_LIST: ${{ steps.ios_signing.outputs.profiles-before-list }}
        PROFILES_CLEANUP_LIST: ${{ steps.ios_signing.outputs.profiles-cleanup-list }}
      run: |
        set +e

        if [[ -n "${ORIGINAL_DEFAULT_KEYCHAIN}" && -f "${ORIGINAL_DEFAULT_KEYCHAIN}" ]]; then
          security default-keychain -d user -s "${ORIGINAL_DEFAULT_KEYCHAIN}"
        fi
        security delete-keychain "${KEYCHAIN_NAME}" >/dev/null 2>&1

        if [[ -f "${PROFILES_CLEANUP_LIST}" ]]; then
          while IFS= read -r profile_path; do
            case "${profile_path}" in
              "${HOME}/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision|\
              "${HOME}/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision)
                rm -f -- "${profile_path}"
                ;;
              *)
                echo "Refusing to remove unexpected provisioning profile path: ${profile_path}" >&2
                ;;
            esac
          done < "${PROFILES_CLEANUP_LIST}"
        fi

        rm -f -- "${PROFILES_BEFORE_LIST}" "${PROFILES_CLEANUP_LIST}"
    - name: Remove local iOS build outputs
      if: always() && inputs.cleanup-output == 'true'
      shell: bash
      run: rm -rf -- "${{ inputs.working-directory }}/build/ios/ipa" "${{ inputs.working-directory }}/build/ios/archive"
