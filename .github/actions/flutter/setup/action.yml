name: Setup Flutter application
description: Installs Flutter dependencies for an application job.

inputs:
  flutter-version:
    description: Flutter SDK version or stable channel
    required: false
    default: stable
  working-directory:
    description: Flutter application directory
    required: true

runs:
  using: composite
  steps:
    - name: Install stable Flutter SDK
      if: inputs.flutter-version == 'stable'
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        cache: true
        cache-path: "${{ runner.temp }}/flutter/:channel:-:version:-:arch:-:hash:"
    - name: Install pinned Flutter SDK
      if: inputs.flutter-version != 'stable'
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ inputs.flutter-version }}
        cache: true
        cache-path: "${{ runner.temp }}/flutter/:channel:-:version:-:arch:-:hash:"
    - name: Verify Flutter toolchain
      shell: bash
      env:
        EXPECTED_FLUTTER_VERSION: ${{ inputs.flutter-version }}
      run: |
        set -euo pipefail

        if [[ -z "${FLUTTER_ROOT:-}" || ! -x "${FLUTTER_ROOT}/bin/flutter" ]]; then
          echo "Flutter SDK was not installed correctly: FLUTTER_ROOT=${FLUTTER_ROOT:-<unset>}" >&2
          exit 1
        fi

        if ! git -C "${FLUTTER_ROOT}" rev-parse --git-dir >/dev/null 2>&1; then
          echo "Flutter SDK is incomplete: ${FLUTTER_ROOT} is not a Git repository." >&2
          exit 1
        fi

        version_output="$(flutter --version)"
        printf '%s\n' "${version_output}"

        actual_flutter_version=""
        while IFS= read -r line; do
          if [[ "${line}" =~ ^Flutter[[:space:]]+([0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*) ]]; then
            actual_flutter_version="${BASH_REMATCH[1]}"
            break
          fi
        done <<< "${version_output}"

        if [[ -z "${actual_flutter_version}" ]]; then
          echo "Could not determine the installed Flutter SDK version." >&2
          exit 1
        fi
        echo "Requested Flutter SDK: ${EXPECTED_FLUTTER_VERSION}"
        echo "Installed Flutter SDK: ${actual_flutter_version}"

        if [[ "${EXPECTED_FLUTTER_VERSION}" != "stable" && "${actual_flutter_version}" != "${EXPECTED_FLUTTER_VERSION}" ]]; then
          echo "Expected Flutter ${EXPECTED_FLUTTER_VERSION}, but ${actual_flutter_version} is active." >&2
          exit 1
        fi
    - name: Resolve Flutter dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: flutter pub get
