name: Release Flutter Android
description: Distributes a built App Bundle to Google Play or promotes it to production.

inputs:
  stage: {required: true, description: beta or production}
  artifact-run-id: {required: false, default: '', description: Draft workflow run containing the App Bundle}
  working-directory: {required: true, description: Flutter application directory}
  app-version: {required: true, description: Semantic application version}
  build-number: {required: true, description: Store build number}
  full-version: {required: true, description: Complete Flutter version}
  beta-command: {required: false, default: ./gradlew publishBundle --track internal, description: Command that uploads the App Bundle to Google Play}
  production-command: {required: false, default: ./gradlew promoteArtifact --from-track internal --promote-track production, description: Command that promotes the beta to production}

runs:
  using: composite
  steps:
    - name: Download signed Android artifact
      if: inputs.stage == 'beta'
      uses: actions/download-artifact@v4
      with:
        name: android-${{ inputs.full-version }}-${{ github.event.pull_request.head.sha || github.sha }}
        path: ${{ runner.temp }}/android-${{ github.run_id }}
        github-token: ${{ github.token }}
        run-id: ${{ inputs.artifact-run-id }}
    - name: Locate downloaded App Bundle
      if: inputs.stage == 'beta'
      id: artifact
      shell: bash
      working-directory: ${{ runner.temp }}/android-${{ github.run_id }}
      run: |
        set -euo pipefail

        aab_path=''
        aab_count=0
        while IFS= read -r candidate; do
          aab_path="${candidate}"
          aab_count=$((aab_count + 1))
        done < <(find . -type f -name '*.aab' -print)

        if [[ "${aab_count}" -ne 1 ]]; then
          echo "Expected exactly one AAB in the draft artifact, found ${aab_count}." >&2
          exit 1
        fi

        absolute_aab_path="${PWD}/${aab_path#./}"
        echo "aab-path=${absolute_aab_path}" >> "${GITHUB_OUTPUT}"
        echo "aab-directory=$(dirname "${absolute_aab_path}")" >> "${GITHUB_OUTPUT}"
    - name: Upload beta to Google Play
      if: inputs.stage == 'beta'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/android
      env:
        APP_VERSION: ${{ inputs.app-version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        FULL_VERSION: ${{ inputs.full-version }}
        AAB_PATH: ${{ steps.artifact.outputs.aab-path }}
        AAB_ARTIFACT_DIRECTORY: ${{ steps.artifact.outputs.aab-directory }}
      run: ${{ inputs.beta-command }} --artifact-dir "${AAB_ARTIFACT_DIRECTORY}"
    - name: Promote to Google Play production
      if: inputs.stage == 'production'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/android
      env:
        APP_VERSION: ${{ inputs.app-version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        FULL_VERSION: ${{ inputs.full-version }}
      run: ${{ inputs.production-command }}
