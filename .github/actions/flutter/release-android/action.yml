name: Release Flutter Android
description: Distributes a built App Bundle to Google Play or promotes it to production.

inputs:
  stage: {required: true, description: beta or production}
  artifact-run-id: {required: false, default: '', description: Workflow run containing the App Bundle}
  working-directory: {required: true, description: Flutter application directory}
  app-version: {required: true, description: Semantic application version}
  build-number: {required: true, description: Store build number}
  full-version: {required: true, description: Complete Flutter version}
  beta-command: {required: false, default: ./gradlew publishBundle --track beta, description: Command that uploads the App Bundle to Google Play closed beta testing}
  production-command: {required: false, default: ./gradlew promoteArtifact --from-track beta --promote-track production, description: Command that promotes the closed beta to production}

runs:
  using: composite
  steps:
    - name: Download signed Android artifact
      if: inputs.stage == 'beta'
      uses: actions/download-artifact@v4
      with:
        name: android-${{ inputs.full-version }}-${{ github.event.pull_request.head.sha || github.sha }}
        path: ${{ runner.temp }}/android-${{ github.run_id }}
        github-token: ${{ github.token }}
        run-id: ${{ inputs.artifact-run-id }}
    - name: Locate downloaded App Bundle
      if: inputs.stage == 'beta'
      id: artifact
      shell: bash
      working-directory: ${{ runner.temp }}/android-${{ github.run_id }}
      run: |
        set -euo pipefail

        aab_path=''
        aab_count=0
        while IFS= read -r candidate; do
          aab_path="${candidate}"
          aab_count=$((aab_count + 1))
        done < <(find . -type f -name '*.aab' -print)

        if [[ "${aab_count}" -ne 1 ]]; then
          echo "Expected exactly one AAB in the build artifact, found ${aab_count}." >&2
          exit 1
        fi

        absolute_aab_path="${PWD}/${aab_path#./}"
        echo "aab-path=${absolute_aab_path}" >> "${GITHUB_OUTPUT}"
        echo "aab-directory=$(dirname "${absolute_aab_path}")" >> "${GITHUB_OUTPUT}"
    - name: Prepare Android Gradle project
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail

        # Flutter exposes --config-only through the apk subcommand only. It
        # writes local Android configuration without building or uploading an
        # APK. The downloaded AAB remains the only release artifact.
        # --config-only may leave wrapper files ignored by an existing Android
        # project absent, so seed only those missing files from the installed
        # Flutter version without touching the app's Gradle configuration.
        flutter build apk --config-only --release --no-pub

        wrapper_files=(
          gradlew
          gradle/wrapper/gradle-wrapper.jar
          gradle/wrapper/gradle-wrapper.properties
        )
        needs_wrapper_seed=false
        for wrapper_file in "${wrapper_files[@]}"; do
          if [[ ! -f "android/${wrapper_file}" ]]; then
            needs_wrapper_seed=true
            break
          fi
        done

        if [[ "${needs_wrapper_seed}" == 'true' ]]; then
          wrapper_seed="$(mktemp -d "${RUNNER_TEMP}/flutter-gradle-wrapper.XXXXXX")"
          cleanup_wrapper_seed() {
            rm -rf -- "${wrapper_seed}"
          }
          trap cleanup_wrapper_seed EXIT

          flutter create \
            --no-pub \
            --platforms=android \
            --project-name=gradle_wrapper_seed \
            "${wrapper_seed}"

          seed_files=(
            gradlew
            gradlew.bat
            gradle/wrapper/gradle-wrapper.jar
            gradle/wrapper/gradle-wrapper.properties
          )
          for wrapper_file in "${seed_files[@]}"; do
            if [[ ! -f "android/${wrapper_file}" ]]; then
              mkdir -p "android/$(dirname "${wrapper_file}")"
              cp "${wrapper_seed}/android/${wrapper_file}" "android/${wrapper_file}"
            fi
          done
        fi

        chmod +x android/gradlew
    - name: Upload beta to Google Play
      if: inputs.stage == 'beta'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/android
      env:
        APP_VERSION: ${{ inputs.app-version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        FULL_VERSION: ${{ inputs.full-version }}
        AAB_PATH: ${{ steps.artifact.outputs.aab-path }}
        AAB_ARTIFACT_DIRECTORY: ${{ steps.artifact.outputs.aab-directory }}
      run: ${{ inputs.beta-command }} --artifact-dir "${AAB_ARTIFACT_DIRECTORY}"
    - name: Promote to Google Play production
      if: inputs.stage == 'production'
      shell: bash
      working-directory: ${{ inputs.working-directory }}/android
      env:
        APP_VERSION: ${{ inputs.app-version }}
        BUILD_NUMBER: ${{ inputs.build-number }}
        FULL_VERSION: ${{ inputs.full-version }}
      run: ${{ inputs.production-command }}
