name: Mobile release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to execute manually
        required: true
        type: choice
        options: [draft, beta, production]
      runner:
        description: Runner used for this manual execution
        required: true
        default: github-hosted
        type: choice
        options: [self-hosted, github-hosted]

permissions:
  contents: read

jobs:
  ci:
    uses: fly-mode-labs/workflows/.github/workflows/main.yml@v3
    with:
      technology: flutter
      pipeline: ci
      delivery-mode: direct
      platforms: android,ios
      android-build-format: appbundle
      runner: ${{ inputs.runner || 'github-hosted' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYALIAS: ${{ secrets.KEYALIAS }}
      STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
      KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}

  cd:
    needs: ci
    uses: fly-mode-labs/workflows/.github/workflows/main.yml@v3
    with:
      technology: flutter
      pipeline: cd
      delivery-mode: direct
      platforms: android,ios
      android-build-format: appbundle
      runner: ${{ inputs.runner || 'github-hosted' }}
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYALIAS: ${{ secrets.KEYALIAS }}
      STOREPASSWORD: ${{ secrets.STOREPASSWORD }}
      KEYPASSWORD: ${{ secrets.KEYPASSWORD }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
      APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ANDROID_PUBLISHER_CREDENTIALS: ${{ secrets.ANDROID_PUBLISHER_CREDENTIALS }}
