name: Mobile release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to execute manually
        required: true
        type: choice
        options: [draft, beta, production]
      runner:
        description: Runner used for this manual execution
        required: true
        default: self-hosted
        type: choice
        options: [self-hosted, github-hosted]

permissions:
  actions: read
  contents: read

jobs:
  pipeline:
    uses: YOUR_GITHUB_USER/workflows/.github/workflows/main.yml@v2
    with:
      technology: flutter
      platforms: android,ios
      android-build-format: appbundle
      runner: ${{ inputs.runner || 'self-hosted' }}
    secrets: inherit
