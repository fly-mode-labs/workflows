name: Mobile release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, converted_to_draft, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      stage:
        description: Stage to execute manually
        required: true
        type: choice
        options: [draft, beta, production]

permissions:
  contents: read

jobs:
  draft-build:
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.draft == true &&
      github.event.action != 'closed') ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'draft')
    uses: YOUR_GITHUB_USER/workflows/.github/workflows/flutter-draft-build.yml@v1.0.0
    with:
      flutter-version: stable
      runner-labels: '["self-hosted", "macOS", "ARM64"]'
    secrets: inherit

  beta:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'ready_for_review') ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'beta')
    uses: YOUR_GITHUB_USER/workflows/.github/workflows/flutter-beta.yml@v1.0.0
    with:
      flutter-version: stable
      runner-labels: '["self-hosted", "macOS", "ARM64"]'
    secrets: inherit

  production:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.merged == true) ||
      (github.event_name == 'workflow_dispatch' && inputs.stage == 'production')
    uses: YOUR_GITHUB_USER/workflows/.github/workflows/flutter-production.yml@v1.0.0
    with:
      runner-labels: '["self-hosted", "macOS", "ARM64"]'
    secrets: inherit
